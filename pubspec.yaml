name: dentmaster
description: "DentMaster - Local dental practice patient history management app."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  get_it: ^8.0.0
  injectable: ^2.5.0
  go_router: ^15.0.0

  # Local Storage
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Image Handling
  file_picker: ^8.0.0
  image: ^4.2.0

  # Export / Import
  archive: ^3.6.0

  # Authentication
  bcrypt: ^1.1.3
  shared_preferences: ^2.3.0

  # UI
  intl: ^0.19.0
  gap: ^3.0.1
  flutter_staggered_animations: ^1.1.1

  # Annotations (runtime)
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  injectable_generator: ^2.6.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
